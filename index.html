<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>AstroBeats Hangout — Group Oracle</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

  <!-- Networked-Aframe -->
  <script src="https://unpkg.com/networked-aframe@^0.14.0/dist/networked-aframe.min.js"></script>

  <!-- Extras -->
  <script src="https://unpkg.com/aframe-randomizer-components@^3.0.1/dist/aframe-randomizer-components.min.js"></script>

<!-- Mobile virtual joystick (shown only on touch devices) -->
<div id="joystick" class="joy">
  <div id="joy-knob" class="joy-knob"></div>
</div>

<script>
    // Ensure avatar schema exists before NAF initializes
    NAF.schemas.getComponentsOriginal = NAF.schemas.getComponents;
    NAF.schemas.getComponents = (template) => {
      if (!NAF.schemas.hasTemplate('#avatar-template')) {
        NAF.schemas.add({
          template: '#avatar-template',
          components: [
            'position',
            'rotation',
            { selector: '.head', component: 'material', property: 'color' }
          ]
        });
      }
      return NAF.schemas.getComponentsOriginal(template);
    };
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 100;
      color: #f0e9ff;
      font-family: Arial, sans-serif;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
      user-select: none;
      line-height: 1.5;
      font-size: 14px;
    }
    .hud .room { opacity: 0.85; font-size: 12px; }
    .hud .status { font-size: 12px; opacity: 0.85; }
    .actions {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: none;
    }
    .joy {
      position: fixed;
      bottom: 42px;
      left: 42px;
      width: 140px;
      height: 140px;
      z-index: 200;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      border: 2px solid rgba(255,255,255,0.22);
      display: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .joy-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255,255,255,0.50);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .joy.active { display: block; }
  </style>
</head>

<body>

<a-scene
  networked-scene="
    room: basic-audio;
    debug: true;
    adapter: webrtc;
    serverURL: https://naf-socket-server.onrender.com;
    audio: true;
  ">

  <!-- Background music (playlist, manual start after click) -->
  <a-sound
    id="bg-music"
    src="assets/miss-you.mp3"
    position="0 0 -88">
  </a-sound>

  <!-- Distant scene object -->
  <a-entity position="-25 0 -60">
    <a-octahedron color="#FF926B" radius="8"></a-octahedron>
  </a-entity>

  <!-- Ground -->
  <a-entity position="0 0 40">
    <a-box repeat="400 400"
           src="assets/grass.jpg"
           depth="600" height="1" width="600">
    </a-box>
  </a-entity>

  <a-sky src="#sky"></a-sky>

  <a-entity position="0 .5 -55">
    <a-entity gltf-model="url(assets/Luxury_House.glb)"></a-entity>
  </a-entity>

  <a-entity position="-13 2.5 -50">
    <a-entity
      rotation="90 0 0"
      gltf-model="url(assets/video_game.glb)"
      animation="property: rotation; to: 90 360 0; loop: true; dur: 1800; easing: linear">
    </a-entity>
  </a-entity>

  <!-- ============ GROUP ORACLE ============ -->
  <a-entity id="oracle" position="0 0 -12">
    <a-cylinder id="altar" radius="3.4" height="1.3" position="0 0.65 0"
                material="color:#3a2f45; metalness:0.1; roughness:0.6"></a-cylinder>
    <a-cylinder radius="3.4" height="0.12" position="0 1.4 0"
                material="color:#544370; metalness:0.15; roughness:0.5" segments-height="1"></a-cylinder>
    <a-cylinder radius="0.9" height="0.06" position="0 1.49 0"
                material="color:#8d6ef0; emissive:#5b3ec0; emissiveIntensity:0.25">
      <a-torus radius="0.9" radius-tubular="0.02" rotation="-90 0 0"
               material="color:#c9aaff; emissive:#8a6bff; emissiveIntensity:0.6"></a-torus>
    </a-cylinder>

    <a-entity light="type:point; intensity:0.7; distance:14; color:#ffd9a0" position="0 2.9 0"></a-entity>

    <!-- crystal (left) -->
    <a-entity class="oracle-card" data-key="crystal" position="-3.15 1.45 0">
      <a-entity class="card-pivot"
                animation__reveal="property: rotation; from: 0 0 0; to: 0 180 0; dur: 700; easing: easeInOutQuad; startEvents: reveal; autoplay: false"
                animation__conceal="property: rotation; from: 0 180 0; to: 0 0 0; dur: 700; easing: easeInOutQuad; startEvents: conceal; autoplay: false">
        <a-plane class="face-back" material="src: oracle/crystals/front/agate-front.jpg; shader: flat"
                 width="1" height="1.44" position="0 0.72 0.012"></a-plane>
        <a-plane class="face-art" material="src: oracle/crystals/text/agate-text.jpg; shader: flat"
                 width="1" height="1.44" position="0 0.72 -0.012" rotation="0 180 0"></a-plane>
      </a-entity>
    </a-entity>


    <!-- astrological body -->
    <a-entity class="oracle-card" data-key="body" position="-1.05 1.45 0">
      <a-entity class="card-pivot"
                animation__reveal="property: rotation; from: 0 0 0; to: 0 180 0; dur: 700; easing: easeInOutQuad; startEvents: reveal; autoplay: false"
                animation__conceal="property: rotation; from: 0 180 0; to: 0 0 0; dur: 700; easing: easeInOutQuad; startEvents: conceal; autoplay: false">
        <a-plane class="face-back" material="src: oracle/astrology/back.jpg; shader: flat"
                 width="1" height="1.44" position="0 0.72 0.012"></a-plane>
        <a-plane class="face-art" material="src: oracle/astrology/body/sun.jpg; shader: flat"
                 width="1" height="1.44" position="0 0.72 -0.012" rotation="0 180 0"></a-plane>
      </a-entity>
    </a-entity>


    <!-- zodiac sign -->
    <a-entity class="oracle-card" data-key="sign" position="1.05 1.45 0">
      <a-entity class="card-pivot"
                animation__reveal="property: rotation; from: 0 0 0; to: 0 180 0; dur: 700; easing: easeInOutQuad; startEvents: reveal; autoplay: false"
                animation__conceal="property: rotation; from: 0 180 0; to: 0 0 0; dur: 700; easing: easeInOutQuad; startEvents: conceal; autoplay: false">
        <a-plane class="face-back" material="src: oracle/astrology/back.jpg; shader: flat"
                 width="1" height="1.44" position="0 0.72 0.012"></a-plane>
        <a-plane class="face-art" material="src: oracle/astrology/sign/01-aries.jpg; shader: flat"
                 width="1" height="1.44" position="0 0.72 -0.012" rotation="0 180 0"></a-plane>

    </a-entity>


    <!-- house -->
    <a-entity class="oracle-card" data-key="house" position="3.15 1.45 0">
      <a-entity class="card-pivot"
                animation__reveal="property: rotation; from: 0 0 0; to: 0 180 0; dur: 700; easing: easeInOutQuad; startEvents: reveal; autoplay: false"
                animation__conceal="property: rotation; from: 0 180 0; to: 0 0 0; dur: 700; easing: easeInOutQuad; startEvents: conceal; autoplay: false">
        <a-plane class="face-back" material="src: oracle/astrology/back.jpg; shader: flat"
                 width="1" height="1.44" position="0 0.72 0.012"></a-plane>
        <a-plane class="face-art" material="src: oracle/astrology/houses/01-first.jpg; shader: flat"
                 width="1" height="1.44" position="0 0.72 -0.012" rotation="0 180 0"></a-plane>
      </a-entity>
    </a-entity>

    <a-entity id="spread-banner" position="0 3.35 0" visible="false">
      <a-plane class="banner-border" width="6.4" height="1.1" position="0 0 0"
               material="color:#bfa0ff; transparent:true; opacity:0.5; shader: flat"></a-plane>
      <a-plane class="banner-bg" width="6.2" height="0.9" position="0 0 0.02"
               material="color:#2a2a33; transparent:true; opacity:0.95; shader: flat"></a-plane>
      <a-text class="banner-text" value="" position="0 0 0.06" align="center"
              color="#ffffff" width="6"></a-text>
    </a-entity>
  </a-entity>
  <!-- ============ /GROUP ORACLE ============ -->

  <!-- Floating oracle buttons -->
  <a-entity id="oracle-buttons">
    <a-entity class="oracle-btn" data-action="reveal" position="-3.2 2.9 -9.2"
              animation__bob="property: position; from: -3.2 2.85 -9.2; to: -3.2 2.95 -9.2; dur: 2300; dir: alternate; loop: true; easing: easeInOutSine">
      <a-ring class="btn-ring" radius-inner="0.95" radius-outer="1.1" rotation="-90 0 0"
              material="color:#5b3ec0; transparent:true; opacity:0.35"></a-ring>
      <a-plane class="btn-face" width="1.7" height="0.55" material="color:#6d4cff; shader: flat" position="0 0 0.02">
        <a-text value="Reveal All" align="center" width="1.9" position="0 0 0.03" color="#fff"></a-text>
      </a-plane>
    </a-entity>

    <a-entity class="oracle-btn" data-action="shuffle" position="0 3.0 -9.6"
              animation__bob="property: position; from: 0 2.95 -9.6; to: 0 3.05 -9.6; dur: 2600; dir: alternate; loop: true; easing: easeInOutSine">
      <a-ring class="btn-ring" radius-inner="1.0" radius-outer="1.15" rotation="-90 0 0"
              material="color:#b85cc7; transparent:true; opacity:0.4"></a-ring>
      <a-plane class="btn-face" width="1.9" height="0.6" material="color:#a04fe0; shader: flat" position="0 0 0.02">
        <a-text value="Shuffle" align="center" width="2.1" position="0 0 0.03" color="#fff"></a-text>
      </a-plane>
    </a-entity>

    <a-entity class="oracle-btn" data-action="hide" position="3.2 2.9 -9.2"
              animation__bob="property: position; from: 3.2 2.85 -9.2; to: 3.2 2.95 -9.2; dur: 2500; dir: alternate; loop: true; easing: easeInOutSine">
      <a-ring class="btn-ring" radius-inner="0.95" radius-outer="1.1" rotation="-90 0 0"
              material="color:#5b3ec0; transparent:true; opacity:0.35"></a-ring>
      <a-plane class="btn-face" width="1.7" height="0.55" material="color:#6d4cff; shader: flat" position="0 0 0.02">
        <a-text value="Hide All" align="center" width="1.9" position="0 0 0.03" color="#fff"></a-text>
      </a-plane>
    </a-entity>
  </a-entity>

  <!-- Assets -->
  <a-assets>
    <img id="sky" src="assets/sunset.jpg" />

    <template id="avatar-template">
      <a-entity class="avatar">
        <a-sphere class="head" scale="0.45 0.5 0.4"></a-sphere>
        <a-entity networked-audio-source position="0 0.05 0">
          <a-sphere color="#efefef" position="0.16 0.1 -0.35" scale="0.12 0.12 0.12">
            <a-sphere color="#000" position="0 0 -1" scale="0.2 0.2 0.2"></a-sphere>
          </a-sphere>
          <a-sphere color="#efefef" position="-0.16 0.1 -0.35" scale="0.12 0.12 0.12">
            <a-sphere color="#000" position="0 0 -1" scale="0.2 0.2 0.2"></a-sphere>
          </a-sphere>
        </a-entity>
      </a-entity>
    </template>
  </a-assets>

  <!-- Player -->
  <a-entity id="rig">
    <a-entity
      id="player"
      networked="template:#avatar-template; attachTemplateToLocal:false;"
      camera
      position="0 1.6 0"
      wasd-controls
      look-controls>
      <a-sphere class="head" visible="false" random-color></a-sphere>
      <a-cursor raycaster="objects: .face-back, .face-art, .btn-ring, .btn-face, .oracle-btn a-text;" fuse="false"></a-cursor>
      <a-entity class="mouse-cursor"
                cursor="rayOrigin: mouse; fuse: false"
                raycaster="objects: .face-back, .face-art, .btn-ring, .btn-face, .oracle-btn a-text; far: 200"></a-entity>
    </a-entity>
  </a-entity>

  <a-entity light="type:ambient; intensity:0.5"></a-entity>

</a-scene>

<!-- HUD -->
<div class="hud">
  <div>🌒 AstroBeats Hangout</div>
  <div class="room" id="hud-room"></div>
  <div class="status" id="hud-status">connecting…</div>
</div>

<script>
(function(){
  'use strict';

  // ---------- assets data ----------
  const KEYS = ['crystal', 'body', 'sign', 'house'];
  let oracleData = null;

  // ---------- shared state ----------
  const ORACLE_TYPE = 'oracle-state';
  let oracleState = { seed: null, flipped: [false, false, false, false], ts: 0 };
  let drawn = null;
  let networkingReady = false;
  let seekers = 1;
  let pendingState = null;

  // Test hook: read-only view of the shared state (used by automated checks).
  window.__ORA = {
    getState: () => ({ seed: oracleState.seed, ts: oracleState.ts, flipped: oracleState.flipped.slice() }),
    getMusic: () => {
      const bg = document.getElementById('bg-music');
      const s = bg && bg.components.sound;
      return {
        track: trackIndex,
        playlist: PLAYLIST.slice(),
        loop: s ? s.data.loop : null,
        loaded: s ? s.loaded : false,
        isPlaying: s ? s.isPlaying : false
      };
    }
  };

  // ---------- deterministic PRNG ----------
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pick(r, arr){ return arr[Math.floor(r() * arr.length)]; }

  function drawFromSeed(seed){
    const r = mulberry32(seed);
    return {
      body:    pick(r, oracleData.astrology.body),
      sign:    pick(r, oracleData.astrology.signs),
      house:   pick(r, oracleData.astrology.houses),
      crystal: pick(r, oracleData.crystals)
    };
  }

  // ---------- card naming ----------
  function toCardName(path){
    if(!path) return '';
    const file = path.split('/').pop().replace(/\.[^.]+$/, '');
    return file
      .split(/[-_]/)
      .filter(p => p && !/^\d+$/.test(p))
      .map(p => p.charAt(0).toUpperCase() + p.slice(1))
      .join(' ');
  }
  function cardNames(){
    if(!drawn) return [];
    return KEYS.map((key) => {
      if(key === 'crystal') return drawn.crystal.name ? toCardName(drawn.crystal.name) : toCardName(drawn.crystal.text);
      return toCardName(drawn[key]);
    });
  }

  // ---------- rendering ----------
  function coverAndArt(key){
    const asset = (p) => 'oracle/' + p;
    if(key === 'crystal'){
      return { cover: asset(drawn.crystal.front), art: asset(drawn.crystal.text) };
    }
    return { cover: 'oracle/astrology/back.jpg', art: asset(drawn[key]) };
  }

  function applyDraw(){
    KEYS.forEach((key) => {
      const card = document.querySelector('.oracle-card[data-key="' + key + '"]');
      if(!card) return;
      const { cover, art } = coverAndArt(key);
      card.querySelector('.face-back').setAttribute('material', 'src', cover);
      card.querySelector('.face-art').setAttribute('material', 'src', art);
    });
  }

  let renderedFlipped = [false, false, false, false];

  function renderOracle(){
    if(!oracleData || !drawn) return;
    applyDraw();
    const prev = renderedFlipped;
    renderedFlipped = (oracleState.flipped || [false, false, false, false]).slice();
    KEYS.forEach((key, i) => {
      const card = document.querySelector('.oracle-card[data-key="' + key + '"]');
      if(!card) return;
      const pivot = card.querySelector('.card-pivot');
      const flipped = !!renderedFlipped[i];
      if(prev[i] !== flipped) pivot.emit(flipped ? 'reveal' : 'conceal');
    });
    updateHud();
    updateBanner();
  }

  function updateBanner(){
    const banner = document.getElementById('spread-banner');
    if(!banner) return;
    if(!drawn || !(oracleState.flipped || []).some(Boolean)){
      banner.setAttribute('visible', false);
      return;
    }
    const names = cardNames();
    const shown = names.filter((n, i) => oracleState.flipped[i]);
    const text = banner.querySelector('.banner-text');
    if(text && text.getAttribute('value') !== shown.join(' · ')){
      text.setAttribute('value', shown.join(' · '));
    }
    banner.setAttribute('visible', true);
  }

  // ---------- audio chimes ----------
  let actx = null;
  function ensureCtx(){
    if(!actx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      actx = new Ctx();
    }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, gain, dur, delay){
    const c = ensureCtx();
    if(!c) return;
    const t = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  function chime(kind){
    if(kind === 'flip'){ tone(880, 0.07, 0.35); tone(1318, 0.05, 0.4, 0.06); }
    else { tone(523.25, 0.06, 0.5); tone(659.25, 0.06, 0.5, 0.12); tone(783.99, 0.06, 0.6, 0.24); }
  }

  // ---------- actions ----------
  function doShuffle(){
    if(!oracleData) return;
    oracleState = {
      seed: Math.floor(Math.random() * 0xffffffff),
      flipped: [false, false, false, false],
      ts: Date.now()
    };
    drawn = drawFromSeed(oracleState.seed);
    renderOracle();
    publish();
    chime('shuffle');
  }

  function clickCard(key){
    if(!oracleData || !drawn) return;
    const i = KEYS.indexOf(key);
    if(i === -1) return;
    // Toggle only this card; other already-flipped cards stay as they are.
    const flipped = oracleState.flipped.slice();
    flipped[i] = !flipped[i];
    oracleState = { seed: oracleState.seed, flipped: flipped, ts: Date.now() };
    renderOracle();
    publish();
    chime('flip');
  }

  function setAll(flipped){
    if(!oracleData || !drawn) return;
    oracleState = { seed: oracleState.seed, flipped: [flipped, flipped, flipped, flipped], ts: Date.now() };
    renderOracle();
    publish();
    chime('flip');
  }

  function publish(){
    if(!networkingReady || !NAF.clientId) return;
    try {
      NAF.connection.broadcastData(ORACLE_TYPE, JSON.stringify(oracleState));
    } catch(err){ /* fine */ }
  }

  function pushStateTo(clientId){
    if(!drawn || !networkingReady) return;
    try {
      NAF.connection.sendData(clientId, ORACLE_TYPE, JSON.stringify(oracleState));
    } catch(err){ /* fine */ }
  }

  function tryParse(data){
    if(typeof data === 'string'){
      try { return JSON.parse(data); } catch(e){ return null; }
    }
    if(data && typeof data === 'object') return data;
    return null;
  }

  function applyRemote(s){
    if(!s || s.seed == null || !Array.isArray(s.flipped)) return;
    if(!oracleData){ pendingState = s; return; }
    if(s.ts <= oracleState.ts) return;
    oracleState = {
      seed: s.seed,
      flipped: s.flipped.map(Boolean),
      ts: s.ts || 1
    };
    drawn = drawFromSeed(oracleState.seed);
    renderOracle();
    updateHud();
  }

  // ---------- HUD ----------
  function updateHud(){
    const statusEl = document.getElementById('hud-status');
    const seekText = seekers + (seekers === 1 ? ' seeker present' : ' seekers present');
    if(!networkingReady){
      statusEl.textContent = 'connecting…';
      return;
    }
    statusEl.textContent = seekText + ' · ' + (NAF.clientId ? 'online' : 'offline');
  }

  // ---------- networking ----------
  function initNetworking(){
    if(networkingReady) return;
    networkingReady = true;

    NAF.connection.subscribeToDataChannel(ORACLE_TYPE, (clientId, type, data) => {
      applyRemote(tryParse(data));
    });

    document.body.addEventListener('clientConnected', (e) => {
      seekers++;
      pushStateTo(e.detail.clientId);
      updateHud();
    });
    document.body.addEventListener('clientDisconnected', () => {
      seekers = Math.max(1, seekers - 1);
      updateHud();
    });

    if(NAF.clientId){
      updateHud();
      setTimeout(() => { if(oracleState.seed == null) doShuffle(); }, 800);
    } else {
      document.body.addEventListener('connected', function connectedHandler(){
        document.body.removeEventListener('connected', connectedHandler);
        updateHud();
        setTimeout(() => { if(oracleState.seed == null) doShuffle(); }, 800);
      });
    }
  }

  // ---------- wiring ----------
  function boot(){
    document.getElementById('hud-room').textContent =
      'room: ' + (new URLSearchParams(location.search).get('room') || 'basic-audio');

    fetch('oracle/data.json')
      .then(r => r.json())
      .then(jsonData => {
        oracleData = jsonData;
        if(pendingState){
          const p = pendingState;
          pendingState = null;
          applyRemote(p);
        } else {
          renderOracle();
        }
      })
      .catch(err => console.error('Failed to load oracle/data.json', err));

    document.querySelector('.oracle-card[data-key="body"]')
      .addEventListener('click', () => clickCard('body'));
    document.querySelector('.oracle-card[data-key="sign"]')
      .addEventListener('click', () => clickCard('sign'));
    document.querySelector('.oracle-card[data-key="house"]')
      .addEventListener('click', () => clickCard('house'));
    document.querySelector('.oracle-card[data-key="crystal"]')
      .addEventListener('click', () => clickCard('crystal'));

    document.querySelectorAll('.oracle-btn').forEach((btn) => {
      btn.addEventListener('mouseenter', () => {
        btn.setAttribute('scale', '1.08 1.08 1.08');
      });
      btn.addEventListener('mouseleave', () => {
        btn.setAttribute('scale', '1 1 1');
      });
      btn.addEventListener('click', () => {
        ensureCtx();
        const action = btn.getAttribute('data-action');
        if(action === 'shuffle') doShuffle();
        else if(action === 'reveal') setAll(true);
        else if(action === 'hide') setAll(false);
      });
    });

    // Offline/fallback: draw locally if the network never connects.
    setTimeout(() => { if(oracleData && oracleState.seed == null) doShuffle(); }, 8000);

    // Network wiring — subscribe as soon as NAF is present.
    (function waitForNAF(){
      if(window.NAF && NAF.connection && NAF.connection.subscribeToDataChannel){
        initNetworking();
      } else {
        setTimeout(waitForNAF, 200);
      }
    })();
  }

  // ---------- mobile virtual joystick ----------
  (function(){
    // Only show on touch-primary devices without hover (phones/tablets), not laptops.
    if(!window.matchMedia('(hover: none) and (pointer: coarse)').matches) return;
    const joy = document.getElementById('joystick');
    const knob = document.getElementById('joy-knob');
    if(!joy || !knob) return;
    joy.classList.add('active');
    const RADIUS = 46;
    let sx = 0, sy = 0, active = false;

    function setKnob(cx, cy){
      let dx = cx - joy.clientWidth / 2;
      let dy = cy - joy.clientHeight / 2;
      const len = Math.hypot(dx, dy);
      if(len > RADIUS){ dx = dx / len * RADIUS; dy = dy / len * RADIUS; }
      sx = dx / RADIUS;
      sy = dy / RADIUS;
      knob.style.transform = 'translate(-50%, -50%) translate(' + dx + 'px, ' + dy + 'px)';
    }
    function release(){
      active = false;
      sx = 0; sy = 0;
      knob.style.transform = 'translate(-50%, -50%)';
    }

    joy.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      active = true;
      try{ joy.setPointerCapture(e.pointerId); }catch(err){}
      const r = joy.getBoundingClientRect();
      setKnob(e.clientX - r.left, e.clientY - r.top);
    });
    joy.addEventListener('pointermove', (e) => {
      if(!active) return;
      e.preventDefault();
      const r = joy.getBoundingClientRect();
      setKnob(e.clientX - r.left, e.clientY - r.top);
    });
    joy.addEventListener('pointerup', release);
    joy.addEventListener('pointercancel', release);

    const player = document.getElementById('player');
    const fwd = new THREE.Vector3();
    const right = new THREE.Vector3();
    const move = new THREE.Vector3();
    let last = performance.now();
    const SPEED = 7.5;

    function tick(now){
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if(active && player && (sx !== 0 || sy !== 0)){
        const cam = player.getObject3D('camera');
        if(cam){
          cam.updateMatrixWorld(true);
          cam.getWorldDirection(fwd);
          fwd.y = 0;
          if(fwd.lengthSq() > 0.0001) fwd.normalize();
          right.setFromMatrixColumn(cam.matrixWorld, 0);
          right.y = 0;
          if(right.lengthSq() > 0.0001) right.normalize();
          move.set(0, 0, 0).addScaledVector(right, sx).addScaledVector(fwd, -sy);
          player.object3D.position.addScaledVector(move, SPEED * dt * Math.min(1, Math.hypot(sx, sy)));
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  // ---------- background playlist ----------
  const PLAYLIST = [
    'assets/miss-you.mp3',
    'assets/Wax%20Doctor%20-%20Offshore%20Drift.mp3'
  ];
  let trackIndex = 0;
  let musicStarted = false;

  function bgMusicEl(){
    return document.getElementById('bg-music');
  }

  function playTrackAt(i){
    if(!PLAYLIST.length) return;
    trackIndex = ((i % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
    const bg = bgMusicEl();
    if(!bg || !bg.components.sound) return;
    bg.setAttribute('sound', 'src', PLAYLIST[trackIndex]);
    bg.components.sound.playSound();
  }

  function startMusic(){
    if(musicStarted) return;
    musicStarted = true;
    const bg = bgMusicEl();
    if(!bg) return;
    bg.addEventListener('sound-ended', () => playTrackAt(trackIndex + 1));
    playTrackAt(0);
  }

  // Resume AudioContext + start background playlist on first click
  document.addEventListener('click', () => {
    const scene = document.querySelector('a-scene');
    const ctx = scene && scene.audioListener && scene.audioListener.context;
    if(ctx && ctx.state === 'suspended') ctx.resume();
    startMusic();
  }, { once: true });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
